<div class=" bg-[#0aad0a]  mx-auto p-6 ">
  <div class="container rounded-lg p-8 mb-8">
    <nav class="flex mb-5 text-sm font-medium text-gray-500" aria-label="Breadcrumb">
      <ol class="inline-flex items-center space-x-1 md:space-x-3">
        <li><a class="hover:text-emerald-600 hover:text-white cursor-pointer" routerLink="/">Home</a></li>
        <li><span class="mx-2 text-gray-400">/</span></li>
        <li><a class="hover:text-emerald-600 text-white">All Products</a></li>
      </ol>
    </nav>

    <div class=" flex items-center ">
      <div class="bg-[#2aad0a]  p-3 rounded-md shadow-xl mr-6">
        <span class="text-white text-xl"><i class="fa-solid fa-box-open"></i></span>
      </div>
      <div class="text-white">
        <h1 class="text-4xl font-bold italic tracking-tight">All Prouducts</h1>
        <p class="text-lg opacity-90 font-light">Explore our complete product collection</p>
      </div>
    </div>
  </div>



</div>

<section class="py-10">
  <div class="container">
    <h2 class="text-3xl font-semibold Product">
      SHOP <span class="text-primary">Product</span>
    </h2>

    <div class="mt-5 grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">

      @for(product of productList()| paginate: {
      id: 'foo',
      itemsPerPage: pageSize(),
      currentPage: cp(),
      totalItems: total()} ; track product._id){
      <app-card [product]="product"></app-card>
      }@empty {
      <div class="col-span-full flex flex-col justify-center items-center py-20">
        <i class="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
        <h2 class="text-gray-500 text-xl font-medium">Loading Products...</h2>
      </div>
      }
    </div>

    <div class="flex my-4 justify-center items-center">
      <pagination-controls (pageChange)="pageChange($event)" id="foo" [maxSize]="9" [directionLinks]="true"
        [autoHide]="true" [responsive]="true" previousLabel="Previous" nextLabel="Next"
        screenReaderPaginationLabel="Pagination" screenReaderPageLabel="page" screenReaderCurrentLabel="You're on page">
      </pagination-controls>
    </div>
  </div>
</section>
