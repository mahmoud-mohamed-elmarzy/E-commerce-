<section class="min-h-screen py-2 flex flex-col bg-primary/15 border">
  <!-- Main 404 Content -->
  <div class="grow flex flex-col items-center justify-center px-4 py-12 text-center space-y-8 relative overflow-hidden">

    <!-- Background Decorative Leaves (Absolute Positioning) -->
    <i class="fa-solid fa-leaf text-green-100 text-6xl absolute top-20 left-10 -rotate-12 opacity-50"></i>
    <i class="fa-solid fa-apple-whole text-green-100 text-5xl absolute bottom-40 left-20 rotate-12 opacity-50"></i>
    <i class="fa-solid fa-seedling text-green-100 text-6xl absolute top-40 right-10 rotate-45 opacity-50"></i>

    <!-- 404 Illustration -->
    <div class="relative mb-4">
      <div class="bg-gray-50/50 rounded-lg w-60 h-50 p-16 relative  shadow-lg">
        <i class="fa-solid fa-cart-shopping text-primary text-8xl md:text-9xl opacity-90"></i>
        <div
          class="absolute -top-5 -end-5 bg-primary text-white flex justify-center items-center font-bold w-20 h-20 rounded-full shadow-lg border-4 border-white text-xl">
          <span> 404</span>
        </div>
      </div>
      <!-- Animated dots below icon -->
      <div class="flex justify-center gap-2 mt-6">
        <span class="w-3 h-3 bg-primary rounded-full opacity-60"></span>
        <span class="w-10 h-10 border-b-2 border-primary rounded-full inline-block"></span>
        <span class="w-3 h-3 bg-primary rounded-full opacity-60"></span>
      </div>
    </div>

    <!-- Main Text -->
    <div class="space-y-3">
      <h1 class="text-5xl md:text-6xl font-black text-secondaryscound tracking-tight">Oops! Nothing Here</h1>
      <p class="text-gray-500 max-w-lg mx-auto text-lg">
        Looks like this page went out of stock! Don't worry, there's plenty more fresh content to explore.
      </p>
    </div>

    <!-- Primary Actions -->
    <div class="flex flex-wrap items-center justify-center gap-4">
      <button routerLink="/"
        class="bg-primary hover:bg-green-700 text-white font-bold py-4 px-10 rounded-2xl transition-all shadow-md flex items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-house"></i> Go to Homepage
      </button>
      <button (click)="goBack()"
        class="bg-white border-2 border-gray-100 hover:border-gray-200 text-gray-700 font-bold py-4 px-10 rounded-2xl transition-all flex items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i> Go Back
      </button>
    </div>

    <!-- Popular Destinations Card -->
    <div class="mt-12 w-full max-w-2xl bg-white rounded-3xl border border-gray-100 shadow-lg p-8">
      <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-6">Popular Destinations</h2>
      <div class="flex flex-wrap justify-center gap-3">
        <button routerLink="/"
          class="px-6 py-2.5 rounded-xl bg-green-100 text-primary font-semibold border border-green-100 hover:bg-green-100 transition cursor-pointer">All
          Products</button>
        <button routerLink="/shop"
          class="px-6 py-2.5 rounded-xl bg-gray-100 text-gray-600 font-semibold border border-gray-100 hover:bg-gray-100 transition cursor-pointer">Categories</button>
        <button
          class="px-6 py-2.5 rounded-xl bg-gray-100 text-gray-600 font-semibold border border-gray-100 hover:bg-gray-100 transition cursor-pointer">Today's
          Deals</button>
        <button routerLink="/support"
          class="px-6 py-2.5 rounded-xl bg-gray-100 text-gray-600 font-semibold border border-gray-100 hover:bg-gray-100 transition cursor-pointer">Contact
          Us</button>
      </div>
    </div>
  </div>


</section>
