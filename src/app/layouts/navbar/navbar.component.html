<nav class="sticky top-0 z-40 w-full border-b border-gray-100 bg-white px-6 py-4 font-sans">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-4">
    <!-- logo  -->
    <a class="shrink-0">
      <img src="/assets/fresh-logo.svg" alt="FreshCart" class="h-7 md:h-8" />
    </a>

    <!-- input search  -->
    <div class="hidden lg:block grow max-w-md">
      <div class="group relative">
        <input type="text" placeholder="Search for products..." #searchInput
          (keyup.enter)="goToSearch(searchInput.value)"
          class="w-full rounded-full border border-gray-200 bg-gray-50 px-6 py-2 pr-12 outline-none transition-all focus:border-emerald-500 focus:ring-emerald-500" />
        <button (click)="goToSearch(searchInput.value)"
          class="absolute right-1 top-1 bottom-1 cursor-pointer flex w-9 items-center justify-center rounded-full bg-emerald-600 text-white transition-colors hover:bg-emerald-700">
          <i class="fas fa-search text-xs"></i>
        </button>
      </div>
    </div>

    <!-- !---------------------------- links  !---------------------------- -->
    <div class="hidden items-center gap-6 md:flex">
      <a routerLink="/" [routerLinkActiveOptions]="{exact:true}" routerLinkActive="text-green-700"
        class="font-medium text-gray-700 transition-colors hover:text-emerald-600 cursor-pointer">Home</a>
      <a routerLink="/shop" routerLinkActive="text-green-700"
        class="font-medium cursor-pointer text-gray-700 transition-colors hover:text-emerald-600">Shop</a>
      <div class="group relative">
        <button
          class=" cursor-pointer flex items-center gap-1 py-2 font-medium text-gray-700 transition-colors group-hover:text-emerald-600">
          Categories
          <i class="fas fa-chevron-down text-2xs transition-transform group-hover:rotate-180"></i>
        </button>
        <div
          class="invisible absolute left-0 z-50 mt-0 w-48 rounded-lg border border-gray-100 bg-white opacity-0 shadow-xl transition-all duration-200 group-hover:visible group-hover:opacity-100">
          <ul class="py-2 text-sm text-gray-700">
            <li>
              <a routerLink="/categories"
                class=" cursor-pointer text-lg block px-4 py-2 hover:bg-emerald-50 hover:text-emerald-600">All
                Categories</a>
            </li>


            @for (category of categories(); track category._id) {
            <li>
              <a [routerLink]="['/project', category._id]"
                class="cursor-pointer text-black text-lg block px-4 py-2 hover:bg-emerald-50 hover:text-emerald-600">
                {{ category.name }}
              </a>
            </li>
            }
          </ul>
        </div>
      </div>
      <a routerLink="/brands" routerLinkActive="text-green-700"
        class="font-medium text-gray-700 transition-colors hover:text-emerald-600 cursor-pointer">Brands</a>
    </div>

    <!-- ? --------------- ICONS  & signin ? ---------------  -->
    <div class="flex items-center gap-2 md:gap-4">

      <button routerLink="/support"
        class=" hidden md:flex justify-strat gap-1 text-sm items-center cursor-pointer w-30   h-10 ">
        <span class="bg-green-100 p-3 rounded-full"><i class="fa-solid fa-headset text-green-700"></i></span>
        <span>
          <p class="text-gray-400">Suppot</p>
          <p>24/7 Help</p>
        </span>
      </button>
      <button
        class="cursor-pointer  hidden md:flex h-10 w-10 items-center justify-center rounded-full text-gray-600 transition-all hover:bg-gray-100 lg:hidden">
        <i class="fas fa-search text-lg"></i>
      </button>
      <button routerLink="/wishlist" routerLinkActive="text-green-700"
        class="cursor-pointer relative  hidden md:flex h-10 w-10 items-center justify-center rounded-full text-gray-600 transition-all hover:bg-gray-100 hover:text-emerald-600">
        <i class="far fa-heart text-xl"></i>
        <span
          class="absolute -right-1 -top-1 rounded-full border-2 border-white bg-red-600 w-6 h-6 text-2xs font-bold text-white">+{{heart()}}</span>
      </button>
      <button routerLink="/cart" routerLinkActive="text-green-700"
        class="cursor-pointer relative   hidden md:flex h-10 w-10 items-center justify-center rounded-full text-gray-600 transition-all hover:bg-gray-100 hover:text-emerald-600">
        <i class="fas fa-shopping-cart text-xl"></i>
        <span
          class="absolute right-1 top-1 rounded-full border-2 border-white bg-emerald-600 px-1.5 text-2xs font-bold text-white">{{count()}}</span>
      </button>


      <div class="hidden sm:flex items-center gap-4 pl-2 md:border-l md:border-gray-200 md:pl-4">



        @if(logged()){
        <button (click)="logOut()"
          class="cursor-pointer flex items-center gap-2 font-medium text-gray-700 transition-colors hover:text-emerald-600">
          <i class="far fa-user text-lg"></i> Sign Out
        </button>
        }
        @else{ <a routerLink="/login" routerLinkActive="text-green-700"
          class="cursor-pointer flex items-center gap-2 font-medium text-gray-700 transition-colors hover:text-emerald-600">
          <i class="far fa-user text-lg"></i> Sign In
        </a>
        <a routerLink="/register" routerLinkActive="text-green-700"
          class="cursor-pointer flex items-center gap-2 font-medium text-gray-700 transition-colors hover:text-emerald-600">
          <i class="fas fa-user-plus text-lg"></i> Sign Up
        </a>
        }




      </div>

      <!-- dropdown when login -->

      <!-- bars button  -->
      <button type="button" data-drawer-target="drawer-right" data-drawer-show="drawer-right"
        data-drawer-placement="right"
        class="cursor-pointer p-2 text-gray-600 hover:text-emerald-600 md:hidden focus:outline-none transition-colors">
        <i class="fas fa-bars text-2xl"></i>
      </button>
    </div>
  </div>
</nav>

      </div>
      <span class="font-medium text-gray-700 group-hover:text-red-600">Wishlist</span>
